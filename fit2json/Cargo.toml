[package]
name              = "fit2json"
version.workspace = true
edition.workspace = true
license.workspace = true
description       = "Command-line tool for querying and extracting data from Garmin FIT files"

[[bin]]
name = "fit2json"
path = "src/main.rs"

[dependencies]
fitlib     = { path = "../fitlib" }
fitparser  = { workspace = true }
clap       = { workspace = true }
anyhow     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
chrono     = { workspace = true }
