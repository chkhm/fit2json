[workspace]
resolver = "2"
members  = ["fitlib", "fit2json", "fitdir", "fithistory"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
fitparser  = "0.10.0"
chrono     = { version = "0.4.44", features = ["serde"] }
rayon      = "1.12.0"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror  = "2.0"
anyhow     = "1.0"
clap       = { version = "4", features = ["derive"] }
quick-xml  = { version = "0.37", features = ["serialize"] }
walkdir    = "2"
zip        = "2"
